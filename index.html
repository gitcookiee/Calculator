<!DOCTYPE html>
<html lang="en" data-theme="nature">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A sleek, powerful, and responsive modern calculator web application with Standard and Scientific modes, history log, customizable themes, and keyboard support.">
  <title>Quantum Calc | Modern Scientific Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Main Calculator Unit -->
    <main class="calculator" id="calculator-app" aria-label="Calculator App">
      
      <!-- Top Bar / Controls Header -->
      <header class="calc-header">
        <div class="brand">
          <div class="logo-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="2" width="16" height="20" rx="2"/>
              <line x1="8" y1="6" x2="16" y2="6"/>
              <line x1="16" y1="14" x2="16" y2="18"/>
              <path d="M16 10h.01"/>
              <path d="M12 10h.01"/>
              <path d="M8 10h.01"/>
              <path d="M12 14h.01"/>
              <path d="M8 14h.01"/>
              <path d="M12 18h.01"/>
              <path d="M8 18h.01"/>
            </svg>
          </div>
          <span class="brand-name">Quantum<span class="brand-accent">Calc</span></span>
        </div>

        <div class="header-actions">
          <!-- Mode Switcher -->
          <div class="mode-toggle-group" role="radiogroup" aria-label="Calculator Mode">
            <button type="button" class="mode-btn active" id="btn-mode-standard" data-mode="standard" title="Standard Mode">Std</button>
            <button type="button" class="mode-btn" id="btn-mode-scientific" data-mode="scientific" title="Scientific Mode">Sci</button>
          </div>

          <!-- Sound Toggle -->
          <button type="button" class="icon-btn" id="sound-toggle" title="Toggle Sound Feedback" aria-label="Toggle Sound">
            <svg class="sound-icon-on" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
            </svg>
            <svg class="sound-icon-off hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="1" y1="1" x2="23" y2="23"/>
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            </svg>
          </button>

          <!-- Theme Dropdown -->
          <div class="theme-selector">
            <button type="button" class="icon-btn" id="theme-menu-btn" title="Change Theme" aria-label="Change Theme">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="5"/>
                <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
              </svg>
            </button>
            <div class="theme-dropdown hidden" id="theme-dropdown">
              <button type="button" class="theme-opt active" data-theme="nature">
                <span class="theme-dot nature"></span> 🌲 Forest & River Wildlife
              </button>
              <button type="button" class="theme-opt" data-theme="cyberpunk">
                <span class="theme-dot cyberpunk"></span> 🌉 Cyberpunk Neon Bridge
              </button>
              <button type="button" class="theme-opt" data-theme="glass">
                <span class="theme-dot glass"></span> 🏔️ Cloud Mountain Bridge
              </button>
              <button type="button" class="theme-opt" data-theme="oled">
                <span class="theme-dot oled"></span> 🌌 Cosmic Nebula & Wildlife
              </button>
            </div>
          </div>

          <!-- History Toggle -->
          <button type="button" class="icon-btn" id="history-toggle" title="View History" aria-label="Toggle History">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/>
              <polyline points="12 6 12 12 16 14"/>
            </svg>
          </button>
        </div>
      </header>

      <!-- Calculator Display Screen -->
      <section class="calc-display-container">
        <!-- Display Badges / Status Indicators -->
        <div class="display-badges">
          <span class="badge badge-deg" id="angle-badge" title="Angle Mode (Click to toggle Deg/Rad)">DEG</span>
          <span class="badge badge-mem hidden" id="memory-badge" title="Memory stored">M</span>
          <span class="badge badge-mode" id="mode-badge">STANDARD</span>
        </div>

        <!-- Expression Preview Line -->
        <div class="expression-line" id="expression-display" aria-live="polite"></div>

        <!-- Primary Output Display -->
        <div class="result-line-wrapper">
          <div class="result-line" id="result-display" tabindex="0" aria-live="assertive">0</div>
        </div>
      </section>

      <!-- Memory Toolbar -->
      <div class="memory-bar">
        <button type="button" class="mem-btn" data-action="mc" id="btn-mc" title="Memory Clear">MC</button>
        <button type="button" class="mem-btn" data-action="mr" id="btn-mr" title="Memory Recall">MR</button>
        <button type="button" class="mem-btn" data-action="m-plus" id="btn-mplus" title="Memory Add">M+</button>
        <button type="button" class="mem-btn" data-action="m-minus" id="btn-mminus" title="Memory Subtract">M-</button>
        <button type="button" class="mem-btn" data-action="ms" id="btn-ms" title="Memory Store">MS</button>
        <button type="button" class="mem-btn highlight-badge" id="btn-angle-toggle" title="Toggle Degrees / Radians">DEG</button>
      </div>

      <!-- Keypad Container -->
      <div class="keypad-container" id="keypad">
        
        <!-- Scientific Panel (Visible in Sci mode) -->
        <div class="sci-keypad hidden" id="sci-keypad">
          <button type="button" class="key key-sci" data-action="func" data-value="sin" title="Sine (sin)">sin</button>
          <button type="button" class="key key-sci" data-action="func" data-value="cos" title="Cosine (cos)">cos</button>
          <button type="button" class="key key-sci" data-action="func" data-value="tan" title="Tangent (tan)">tan</button>
          <button type="button" class="key key-sci" data-action="func" data-value="asin" title="Arcsine (asin)">sin⁻¹</button>
          <button type="button" class="key key-sci" data-action="func" data-value="acos" title="Arccosine (acos)">cos⁻¹</button>

          <button type="button" class="key key-sci" data-action="func" data-value="atan" title="Arctangent (atan)">tan⁻¹</button>
          <button type="button" class="key key-sci" data-action="func" data-value="log" title="Logarithm base 10">log</button>
          <button type="button" class="key key-sci" data-action="func" data-value="ln" title="Natural Logarithm">ln</button>
          <button type="button" class="key key-sci" data-action="func" data-value="sqrt" title="Square Root (√)">√</button>
          <button type="button" class="key key-sci" data-action="func" data-value="cbrt" title="Cube Root (∛)">∛</button>

          <button type="button" class="key key-sci" data-action="operator" data-value="^" title="Exponentiation (x^y)">xʸ</button>
          <button type="button" class="key key-sci" data-action="operator" data-value="^2" title="Square (x²)">x²</button>

          <button type="button" class="key key-sci" data-action="constant" data-value="π" title="Pi (π)">π</button>
          <button type="button" class="key key-sci" data-action="constant" data-value="e" title="Euler's Number (e)">e</button>
          <button type="button" class="key key-sci" data-action="action" data-value="factorial" title="Factorial (!)">n!</button>
        </div>

        <!-- Standard Keypad Grid -->
        <div class="std-keypad" id="std-keypad">
          <!-- Row 1 -->
          <button type="button" class="key key-func" data-action="clear-all" title="Clear All (Escape)">AC</button>
          <button type="button" class="key key-func" data-action="backspace" title="Backspace (Backspace)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/>
              <line x1="18" y1="9" x2="12" y2="15"/>
              <line x1="12" y1="9" x2="18" y2="15"/>
            </svg>
          </button>
          <button type="button" class="key key-func" data-action="parentheses" data-value="()" title="Parentheses ()">( )</button>
          <button type="button" class="key key-operator" data-action="operator" data-value="%" title="Percent">%</button>
          <button type="button" class="key key-operator" data-action="operator" data-value="÷" title="Divide (/)">÷</button>

          <!-- Row 2 -->
          <button type="button" class="key key-num" data-action="num" data-value="7">7</button>
          <button type="button" class="key key-num" data-action="num" data-value="8">8</button>
          <button type="button" class="key key-num" data-action="num" data-value="9">9</button>
          <button type="button" class="key key-operator" data-action="operator" data-value="×" title="Multiply (*)">×</button>

          <!-- Row 3 -->
          <button type="button" class="key key-num" data-action="num" data-value="4">4</button>
          <button type="button" class="key key-num" data-action="num" data-value="5">5</button>
          <button type="button" class="key key-num" data-action="num" data-value="6">6</button>
          <button type="button" class="key key-operator" data-action="operator" data-value="-" title="Subtract (-)">-</button>

          <!-- Row 4 -->
          <button type="button" class="key key-num" data-action="num" data-value="1">1</button>
          <button type="button" class="key key-num" data-action="num" data-value="2">2</button>
          <button type="button" class="key key-num" data-action="num" data-value="3">3</button>
          <button type="button" class="key key-operator" data-action="operator" data-value="+" title="Add (+)">+</button>

          <!-- Row 5 -->
          <button type="button" class="key key-num" data-action="negate" title="Plus / Minus (±)">±</button>
          <button type="button" class="key key-num" data-action="num" data-value="0">0</button>
          <button type="button" class="key key-num" data-action="decimal" data-value="." title="Decimal point (.)">.</button>
          <button type="button" class="key key-equals" data-action="calculate" title="Calculate (Enter / =)">=</button>
        </div>

      </div>

      <!-- Quick Keyboard Hint Footer -->
      <footer class="calc-footer">
        <span class="hint-text">Press <kbd>Enter</kbd> = , <kbd>Esc</kbd> AC , <kbd>Backspace</kbd> ⌫</span>
      </footer>

    </main>

    <!-- History Drawer Side Panel -->
    <aside class="history-panel hidden" id="history-panel" aria-label="Calculation History">
      <div class="history-header">
        <h3>Calculation History</h3>
        <div class="history-actions">
          <button type="button" class="icon-btn text-btn" id="clear-history-btn" title="Clear History">Clear</button>
          <button type="button" class="icon-btn" id="close-history-btn" title="Close History" aria-label="Close History">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="history-list" id="history-list">
        <div class="empty-history" id="empty-history-msg">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
          <p>No history yet</p>
          <span>Your calculations will appear here.</span>
        </div>
      </div>
    </aside>
  </div>

  <script src="script.js"></script>
</body>
</html>
